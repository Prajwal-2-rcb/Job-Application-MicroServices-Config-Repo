spring:
  application:
    name: ApiGateWay

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: job-service
              uri: lb://JOB-MICROSERVICE
              predicates:
                - Path=/api/v1/jobs/**

            - id: company-service
              uri: lb://COMPANY-MICROSERVICE
              predicates:
                - Path=/api/v1/company/**

            - id: review-service
              uri: lb://REVIEW-MICROSERVICE
              predicates:
                - Path=/api/v1/reviews/**

server:
  port: ${SERVER_PORT:9090}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    hostname: ${HOST_NAME:localhost}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO
    org.springframework.cloud.gateway: TRACE
